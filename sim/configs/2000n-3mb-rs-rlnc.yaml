name: bench-500
description: "500-node, 2 MiB benchmark comparing gossipsub, RS, RLNC"

simulation:
  driver: shadow
  log_level: info
  trace_file: trace.bctrace

topology:
  generate:
    num_nodes: 2000
    degree: 10
    type: realistic
    seed: 1828923
    super_node_fraction: 0.05

workload:
  num_messages: 1
  message_size: 3145728
  publish_wait_seconds: 10.0
  stop_time_minutes: 10.0
  warmup: auto

strategies:
  - name: RS
    chunk_len: 65536
    enable_bitmaps: true
    bitmap_threshold: 0
  - name: RLNC
    target_chunk_size: 65536
    num_chunks_per_generation: 16
