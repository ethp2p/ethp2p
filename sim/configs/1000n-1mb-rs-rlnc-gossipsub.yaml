name: bench-1000-1mb
description: "1000-node, 1 MiB benchmark comparing RS, RLNC, gossipsub"

simulation:
  driver: shadow
  log_level: info
  trace_file: trace.bctrace

topology:
  generate:
    num_nodes: 1000
    degree: 8
    type: realistic
    seed: 1828923
    super_node_fraction: 0.05

workload:
  num_messages: 2
  message_size: 1048576
  publish_wait_seconds: 30.0
  stop_time_minutes: 10.0

strategies:
  - name: RS
    data_shards: 16
    parity_shards: 16

  - name: gossipsub
