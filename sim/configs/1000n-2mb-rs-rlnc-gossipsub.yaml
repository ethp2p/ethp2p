name: bench-1000
description: "1000-node, 2 MiB benchmark comparing gossipsub, RS, RLNC"

simulation:
  driver: shadow
  log_level: info
  trace_file: trace.bctrace

topology:
  generate:
    num_nodes: 1000
    degree: 8
    type: realistic
    seed: 1828923
    super_node_fraction: 0.05

workload:
  num_messages: 2
  message_size: 2097152
  publish_wait_seconds: 30.0
  stop_time_minutes: 10.0

strategies:
  - name: gossipsub

  - name: RS
    chunk_len: 16384
    enable_bitmaps: true
    bitmap_threshold: 100
