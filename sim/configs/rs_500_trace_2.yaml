name: rs-500-trace
description: "500-node RS with 16 KiB chunks, bitmaps from start, .bctrace for viz"

simulation:
  driver: shadow
  log_level: info
  trace_file: trace.bctrace

topology:
  generate:
    num_nodes: 100
    degree: 10
    type: realistic
    seed: 1828923
    super_node_fraction: 0.05

workload:
  num_messages: 2
  message_size: 2097152
  publish_wait_seconds: 30.0
  stop_time_minutes: 10.0

strategies:
  - name: RS
    chunk_len: 16384
    enable_bitmaps: true
    bitmap_threshold: 0
#  - name: gossipsub
