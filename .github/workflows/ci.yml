name: CI

on:
  push:
    branches: [main]
  # no branch filter: stacked PRs target non-main bases (e.g. quictls-handshake)
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint specs
        uses: rvben/rumdl@v0
        with:
          path: specs/
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race . ./protocol/... ./transport/... ./broadcast/...

      - name: Run integration tests
        run: go test -race -tags=integration ./broadcast/tests/...

  simnet-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run RS simnet tests
        run: go test -race -v -run 'TestNetwork/RS|TestNodeReconnection' ./sim/...

  simnet-gossipsub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Gossipsub simnet tests
        run: go test -race -v -run 'TestNetwork/Gossipsub' ./sim/...

  large-network-rs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run large network RS tests
        run: go test -race -v -run 'TestLargeNetwork_RS|TestScalability' ./sim/...

