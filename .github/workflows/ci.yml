name: CI

on:
  push:
    branches: [main]
  # no branch filter: stacked PRs target non-main bases (e.g. quictls-handshake)
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint specs
        uses: rvben/rumdl@v0
        with:
          path: specs/
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race $(go list ./... | grep -v '/sim$')

      - name: Run sim trace tests
        run: go test -race -run 'TestTraceWriter|TestTracingObserver|TestGossipsubTrace|TestBuildTraceHeaderOptions|TestNodeIdentity' ./sim/...

  sim-cli-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Run sim CLI tests
        run: cd sim/cli && uv sync && uv run python -m unittest discover -s tests

  simnet-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run RS simnet tests
        run: go test -race -v -run 'TestNetwork/RS' ./sim/...

  simnet-gossipsub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Gossipsub simnet tests
        run: go test -race -v -run 'TestNetwork/Gossipsub' ./sim/...
