name: CI

on:
  push:
    branches: [main]
  # no branch filter: stacked PRs target non-main bases (e.g. quictls-handshake)
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint specs
        uses: rvben/rumdl@v0
        with:
          version: "0.2.78"
          path: specs/
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Run staticcheck
        run: staticcheck ./...

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -v ./broadcast/...

  simnet-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run RS simnet tests
        run: go test -race -v -run 'TestNetwork/RS' ./sim/...

  simnet-gossipsub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Gossipsub simnet tests
        run: go test -race -v -run 'TestNetwork/Gossipsub' ./sim/...
